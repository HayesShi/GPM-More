name: CPU validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,plots]'
      - name: Test model, data and exact resume
        run: python -m pytest
      - name: Regenerate figures from archived aggregate data
        env:
          MPLBACKEND: Agg
        run: python scripts/plot_findings.py
